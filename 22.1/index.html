<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div>
        <header style="text-align: center;">
            <h1>Hola</h1>
            <hr>

        </header>
        <div>
            <form action="singup.html" method="post" style="margin-left: 20px;">
                <label for="name">enter you name</label>
                <input type="text" name="name" id="name"><br><br>

                <label for="age">enter your age</label>
                <input type="number" name="age" id="age"><br><br>

                <label for="email">enter your email</label>
                <input type="email" name="email" id="email"><br><br>

                <label for="eyeColor">enter your eye color</label>
                <input type="color" name="eyeColor" id="eyeColor"><br><br>

                <label for="date">enter your date and time</label>
                <input type="datetime-local" name="date" id="date"><br><br>

                <label for="password">enter your password</label>
                <input type="password" name="password" id="password"><br><br>

                <label for="senior">are you a senior citizen</label>
                <input type="checkbox"  name="senior" id="senior"><br><br>

                <button type="submit">send</button>

            </form>
        </div>



    </div>

</body>

</html>
